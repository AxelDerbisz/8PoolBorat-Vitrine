<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black 8-ball -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#333333" stroke-width="2"/>

  <!-- White circle for number -->
  <circle cx="50" cy="50" r="20" fill="#FFFFFF"/>

  <!-- Number 8 -->
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle" dominant-baseline="central">8</text>

  <!-- Shine effect -->
  <ellipse cx="35" cy="35" rx="12" ry="18" fill="#FFFFFF" opacity="0.3" transform="rotate(-45 35 35)"/>
</svg>
