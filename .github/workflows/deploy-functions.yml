name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'hub-gestion/functions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'hub-gestion/functions/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: hub-gestion

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hub-gestion/functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: npm ci
        working-directory: hub-gestion/functions

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_PROJECT: ${{ secrets.HUB_FIREBASE_PROJECT_ID }}

  lint-functions:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hub-gestion/functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: hub-gestion/functions

      - name: Run ESLint (if configured)
        run: npm run lint --if-present
        working-directory: hub-gestion/functions
